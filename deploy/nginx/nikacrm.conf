# HTTP -> HTTPS редирект для CRM
server {
    listen 80;
    server_name crm.profi-service73.ru;
    return 301 https://$host$request_uri;
}

# HTTPS для CRM
server {
    listen 443 ssl;
    server_name crm.profi-service73.ru;

    ssl_certificate /etc/letsencrypt/live/crm.profi-service73.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.profi-service73.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    location /images/ {
        alias /var/www/nikacrm/images/;
        autoindex off;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
